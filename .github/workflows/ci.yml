name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest
      - run: python -m pip check
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: python -m pip install build
      - run: python -m build
      - run: python -m venv clean-env
      - run: clean-env/bin/python -m pip install dist/*.whl
      - run: clean-env/bin/nerd-mcp --version
      - run: clean-env/bin/python -m nerd_mcp --version
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip "setuptools>=83"
      - run: python -m pip install -e ".[full]" pip-audit
      # Netmiko 4.7 requires Paramiko <5. Track PYSEC-2026-2858 until Netmiko
      # supports Paramiko 5; NERD disables agent/key auto-loading and verifies host keys.
      - run: python -m pip_audit --ignore-vuln PYSEC-2026-2858
